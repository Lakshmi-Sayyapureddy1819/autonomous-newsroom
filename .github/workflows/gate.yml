name: gate

on:
  pull_request:
    # `edited` re-evaluates when the PR body changes (adds/removes "Closes #N").
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout gate scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Verify verdict labels (newsroom PRs only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%/*}"; NAME="${REPO#*/}"

          # Authoritative live lookup (the event payload has neither fresh labels
          # after re-runs nor closing references).
          LINKED=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:10){totalCount}}}}' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount') || LINKED=""

          LABELS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '[.[].name]') || LABELS="[]"
          HAS_REVIEW=$(echo "$LABELS" | jq -r 'index("review:approved") != null')
          HAS_TEST=$(echo "$LABELS" | jq -r 'index("test:passed") != null')
          HAS_CONFLICT=$(echo "$LABELS" | jq -r '(index("review:changes-requested") != null) or (index("test:failed") != null)')

          echo "linked issues: ${LINKED:-unknown} | review:approved: ${HAS_REVIEW} | test:passed: ${HAS_TEST} | stale rejection: ${HAS_CONFLICT}"
          bash .github/scripts/gate_decide.sh "${LINKED}" "${HAS_REVIEW}" "${HAS_TEST}" "${HAS_CONFLICT}"
