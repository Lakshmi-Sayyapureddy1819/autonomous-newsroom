<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autonomous Newsroom{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        <p>&copy; {{ current_year }} Autonomous Newsroom. All rights reserved.</p>
        {% if last_updated_message %}
            <p>Last updated: {{ last_updated_message }}</p>
        {% endif %}
    </div>
</body>
</html>
